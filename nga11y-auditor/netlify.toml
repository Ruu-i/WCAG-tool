[build]
  command = "npm run build"
  publish = "dist/nga11y-auditor/browser"

[dev]
  command = "ng serve --host 0.0.0.0"
  targetPort = 4200
  port = 8888
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/assets/monaco/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
