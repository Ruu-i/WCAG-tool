<div class="app-shell">

  <!-- Header -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true"></span>
        <h1 class="brand-name">NgA11y <span class="brand-accent">Auditor</span></h1>
        <span class="brand-tag">WCAG 2.1 A/AA  Angular 17+</span>
      </div>
      <nav class="header-links" aria-label="External links">
        <a
          href="https://www.w3.org/WAI/WCAG21/quickref/"
          target="_blank"
          rel="noopener noreferrer"
          class="header-link"
          aria-label="WCAG 2.1 Quick Reference (opens in new tab)"
        >
          WCAG 2.1 Ref
        </a>
      </nav>
    </div>
  </header>

  <!-- Mobile notice -->
  <div class="mobile-banner" role="note" aria-label="Desktop recommended">
    <span aria-hidden="true">🖥</span>
    Best experienced on desktop — Monaco editor is limited on mobile
  </div>

  <!-- Main layout -->
  <main class="app-main" role="main">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Examples sidebar">
      <app-example-picker
        (exampleSelected)="onExampleSelected($event)"
      ></app-example-picker>
    </aside>

    <!-- Editor pane: code editor (audit view) or diff editor (fix view) -->
    <section class="editor-pane" [attr.aria-label]="view === 'fix' ? 'Fixed code diff' : 'Code editor'">
      @if (view === 'fix' && fixResult) {
        <div class="fix-pane-header">
          <button class="btn-back" (click)="backToAudit()" aria-label="Back to code editor">
            ← Back to editor
          </button>
        </div>
        <div class="fix-pane-body">
          <app-fix-panel
            [fixResult]="fixResult"
            [originalCode]="fixLanguage === 'typescript' ? (lastContent?.tsCode ?? '') : (lastContent?.templateCode ?? '')"
            [language]="fixLanguage"
          ></app-fix-panel>
        </div>
      } @else {
        <app-code-editor
          (auditRequest)="onAuditRequest($event)"
        ></app-code-editor>
      }
    </section>

    <!-- Results pane -->
    <section class="results-pane" aria-label="Audit results">
      <app-results-panel
        [state]="panelState"
        [violations]="violations"
        [errorMessage]="errorMessage"
        [fixLoading]="fixLoading"
        (retryClicked)="onRetry()"
        (fixAllClicked)="onFixAll()"
      ></app-results-panel>
    </section>

  </main>

  <!-- Footer -->
  <footer class="app-footer" role="contentinfo">
    <p>
      Powered by
      <a href="https://www.anthropic.com" target="_blank" rel="noopener noreferrer">Claude AI</a>
       Built with Angular 17  Deploys on Netlify
    </p>
    <p class="footer-note">Best used on desktop. AI findings require human verification.</p>
  </footer>

</div>
